{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h1 class="mb-4">Add Student</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Save Student
        </button>

        <a href="{% url 'student-list' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>
    
</div>

{% endblock %}
