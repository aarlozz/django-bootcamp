<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Student Management System{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="{% url 'home' %}">
                Student Management System
            </a>

            <div>

    <a class="btn btn-outline-light me-2" href="{% url 'home' %}">
        Home
    </a>

    <a class="btn btn-outline-light me-2" href="{% url 'about' %}">
        About
    </a>

    {% if user.is_authenticated %}

        <a class="btn btn-outline-light me-2" href="{% url 'student-list' %}">
            Students
        </a>

        <form method="POST" action="{% url 'logout' %}" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-light">
                Logout ({{ user.username }})
            </button>
        </form>

    {% else %}

        <a class="btn btn-outline-light me-2" href="{% url 'login' %}">
            Login
        </a>

        <a class="btn btn-outline-light" href="{% url 'register' %}">
            Register
        </a>

    {% endif %}

</div>

        </div>
    </nav>

    <main class="container py-5">

        {% block content %}
        {% endblock %}

    </main>

</body>
</html>
